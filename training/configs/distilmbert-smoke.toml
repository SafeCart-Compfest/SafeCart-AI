[model]
name = "distilbert-base-multilingual-cased"
max_length = 128

[training]
seed = 42
learning_rate = 2e-5
epochs = 1
train_batch_size = 8
eval_batch_size = 16
gradient_accumulation_steps = 1
weight_decay = 0.01
warmup_ratio = 0.1
early_stopping_patience = 1
max_train_samples = 96
max_dev_samples = 48
mixed_precision = true
