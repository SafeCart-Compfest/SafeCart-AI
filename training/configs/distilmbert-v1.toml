[model]
name = "distilbert-base-multilingual-cased"
max_length = 192

[training]
seed = 42
learning_rate = 2e-5
epochs = 3
train_batch_size = 16
eval_batch_size = 32
gradient_accumulation_steps = 2
weight_decay = 0.01
warmup_ratio = 0.1
early_stopping_patience = 1
max_train_samples = 180000
max_dev_samples = 20000
mixed_precision = true
