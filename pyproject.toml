[project]
name = "safecart-ai"
version = "0.1.0"
description = "OCR, retrieval, matching, calibration, and inference service for SafeCart"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<2.3",
  "pydantic-settings>=2.10,<3",
  "rapidfuzz>=3.13,<4",
  "scikit-learn>=1.7,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
ml = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "torch>=2.7,<3",
  "transformers>=4.56,<5",
]

[project.scripts]
safecart-ai-audit-bpom = "safecart_ai.cli.audit_bpom:main"
safecart-ai-build-catalog = "safecart_ai.cli.build_catalog:main"
safecart-ai-evaluate-retrieval = "safecart_ai.cli.evaluate_retrieval:main"
safecart-ai-generate-pairs = "safecart_ai.cli.generate_pairs:main"
safecart-ai-train-matcher = "safecart_ai.cli.train_matcher:main"
safecart-ai-verify-manifest = "safecart_ai.cli.verify_manifest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safecart_ai"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["safecart_ai"]
omit = ["src/safecart_ai/matching/hf_training.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*", "sklearn", "sklearn.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
